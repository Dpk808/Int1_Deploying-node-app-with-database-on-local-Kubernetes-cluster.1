apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp  
        image: deepakk2212/node-k8s-demo:v2  #change this with a node app /
        ports:
        - containerPort: 3000   # and its port is same /
        env:
        - name: USER_NAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret   # form secrets
              key: mongo-user
        - name: USER_PWD
          valueFrom:
            secretKeyRef:
              name: mongo-secret    # form secrets
              key: mongo-password
        - name: DB_URL   
          valueFrom:
            configMapKeyRef:
              name: mongo-config   # form config
              key: mongo-url       



---

apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: NodePort    # ClusterIP is default (for internal) and NodePort is for External Service (being able to access on webpage)
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30200         # exposes the Service on each Node's IP at a static port  (port range: 30000-32767)

 